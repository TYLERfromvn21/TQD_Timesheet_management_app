<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống</title>
    <style>
        /* Global Layout */
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; height: 100vh; display: flex; overflow: hidden; }
        
        /* Left Panel: Visual Branding */
        .left-panel { flex: 1; background: linear-gradient(135deg, #ff4d4d 0%, #ff9a9e 100%); position: relative; display: flex; align-items: center; justify-content: center; color: white; flex-direction: column; }
        .circle { position: absolute; background: rgba(255,255,255,0.1); border-radius: 50%; }
        .c1 { width: 300px; height: 300px; top: -50px; left: -50px; }
        .c2 { width: 200px; height: 200px; bottom: 50px; right: 50px; }
        
        /* Right Panel: Login Form */
        .right-panel { flex: 1; background: white; display: flex; align-items: center; justify-content: center; padding: 40px; }
        .login-box { width: 100%; max-width: 400px; }
        h1 { color: #333; margin-bottom: 30px; font-size: 28px; text-align: left; }
        
        /* Input Fields */
        .form-group { margin-bottom: 20px; position: relative; } /* Relative positioning for Eye Icon */
        label { display: block; margin-bottom: 8px; color: #666; font-weight: 500; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; transition: 0.3s; }
        input:focus { border-color: #ff4d4d; outline: none; }
        
        /* Action Buttons */
        .btn-login { width: 100%; padding: 12px; background: #ff4d4d; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn-login:hover { background: #e60000; }
        .extra-links { margin-top: 20px; font-size: 14px; color: #666; display: flex; justify-content: space-between; align-items: center; }
        .btn-admin { background: #333; color: white; padding: 5px 10px; text-decoration: none; border-radius: 4px; font-size: 12px; cursor: pointer; }
        
        /* Alerts */
        #error-msg, #success-msg { margin-top: 15px; padding: 10px; border-radius: 4px; font-size: 14px; display: none; }
        .error { background: #ffe6e6; color: #d63031; border: 1px solid #fab1a0; }
        .success { background: #e6fffa; color: #00b894; border: 1px solid #55efc4; }
        
        /* Password Visibility Toggle Icon */
        .eye-icon {
            position: absolute;
            right: 15px;
            top: 42px;
            cursor: pointer;
            font-size: 1.2em;
            color: #666;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) { .left-panel { display: none; } }
    </style>
</head>
<body>
    <div class="left-panel">
        <div class="circle c1"></div>
        <div class="circle c2"></div>
        <h2 style="font-size: 3em; margin: 0;">TÍN VIỆT</h2>
        <p style="opacity: 0.8;">Hệ thống quản lý Timesheet</p>
    </div>

    <div class="right-panel">
        <div class="login-box">
            <h1>Đăng nhập</h1>
            <form action="/login" method="POST">
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" name="username" required placeholder="Nhập username...">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" name="password" id="loginPass" required placeholder="Nhập mật khẩu..." style="padding-right: 40px;">
                    <span onclick="togglePass('loginPass')" class="eye-icon">👁️</span>
                </div>
                <button type="submit" class="btn-login">ĐĂNG NHẬP</button>
                <div class="extra-links">
                    <span>Chưa có tài khoản? Liên hệ quản lý.</span>
                    <span onclick="handleAdminLogin()" class="btn-admin">Admin log in</span>
                </div>
            </form>
            <div id="error-msg" class="error"></div>
            <div id="success-msg" class="success"></div>
        </div>
    </div>

    <script>
        /**
         * Toggles password visibility.
         * @param {string} id - The ID of the input field.
         */
        function togglePass(id) {
            const x = document.getElementById(id);
            x.type = (x.type === "password") ? "text" : "password";
        }

        // Notification handling via URL params
        const params = new URLSearchParams(window.location.search);
        if(params.get('error')) {
            const d = document.getElementById('error-msg'); d.style.display='block'; d.textContent=decodeURIComponent(params.get('error'));
        }
        if(params.get('message')) {
            const d = document.getElementById('success-msg'); d.style.display='block'; d.textContent=decodeURIComponent(params.get('message'));
        }

        /**
         * Handles routing for Admin Login.
         * Checks the system status API to decide redirection:
         * - If Setup Mode (No admins): Go to '/admin-create' (Setup Wizard).
         * - If Normal Mode: Go to '/admin-auth' (Login).
         */
        async function handleAdminLogin() {
            try {
                const res = await fetch('/check-system-status');
                const data = await res.json();
                if (data.isSetupMode) {
                    window.location.href = '/admin-create';
                } else {
                    window.location.href = '/admin-auth';
                }
            } catch (e) {
                alert("Lỗi kết nối Server! Đảm bảo bạn đã chạy 'pm2 start app.js'");
            }
        }
    </script>
</body>
</html>
