<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timesheet Management</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
        }
        .left-panel {
            width: 33.33%;
            background: linear-gradient(135deg, #ff4d4d, #ff80a3);
            position: relative;
            overflow: hidden;
        }
        .left-panel::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            top: -150px;
            left: -150px;
        }
        .left-panel::after {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            bottom: -100px;
            right: -100px;
        }
        .right-panel {
            width: 66.66%;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border-top-left-radius: 50cm;
            border-bottom-left-radius: 50cm;
        }
        .login-container {
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        .login-container h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #333;
            font-weight: bold;
        }
        .login-container input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
        }
        .login-container label {
            display: block;
            text-align: left;
            margin-bottom: 5px;
            color: #666;
        }
        .login-container .admin-button {
            text-align: left;
            margin: 10px 0;
            color: #666;
        }
        .login-container .admin-button button {
            padding: 5px 10px;
            background-color: #ff4d4d;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 0.9em;
            cursor: pointer;
            margin-left: 10px;
            vertical-align: middle;
            width: 60px; /* Width riêng cho nút Admin */
        }
        .login-container .admin-button button:hover {
            background-color: #e60000;
        }
        .login-container .login-button {
            width: 100%; /* Width riêng cho nút Đăng nhập */
            padding: 10px;
            background-color: #ff4d4d;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
        }
        .login-container .login-button:hover {
            background-color: #e60000;
        }
    </style>
</head>
<body>
    <div class="left-panel"></div>
    <div class="right-panel">
        <div class="login-container">
            <h1>TIMESHEET</h1>
            <label for="username">Tên người dùng</label>
            <input type="text" id="username" name="username">
            <label for="password">Mật mã tài khoản</label>
            <input type="password" id="password" name="password">
            <div class="admin-button">
                Chưa có tài khoản? Nhờ admin tạo tài khoản <button onclick="window.location.href='admin.html'">Admin</button>
            </div>
            <button class="login-button">Đăng nhập</button>
        </div>
    </div>
</body>
</html>
